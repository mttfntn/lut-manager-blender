name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  blender:
    name: Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender: ["5.3"]   # supported versions: keep in sync with bl_info["blender"]
    steps:
      - uses: actions/checkout@v4

      - name: System libraries Blender needs headless
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 \
            libsm6 libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri

      - name: Cache Blender download
        uses: actions/cache@v4
        with:
          path: ~/blender/*.tar.xz
          key: blender-${{ matrix.blender }}-linux-x64-v1

      - name: Download Blender ${{ matrix.blender }}
        run: echo "BLENDER=$(bash tools/get_blender.sh ${{ matrix.blender }})" >> "$GITHUB_ENV"

      - name: Run test suite (CPU compositor; CI has no GPU)
        run: |
          mkdir -p "$RUNNER_TEMP/profile"
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/profile" "$BLENDER" -b --factory-startup \
            --python tests/test_addon.py -- --dump "$RUNNER_TEMP/results.json" | tee "$RUNNER_TEMP/test.log"
          exit "${PIPESTATUS[0]}"

      - name: Keep the log (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-blender-${{ matrix.blender }}
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/results.json
          retention-days: 3
          if-no-files-found: ignore
